<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>كنز النيات</title>
  <meta name="description" content="تطبيق كنز النيات — عُدّ نواياك واحفظ رصيدك. اختَر سياقك، عُدّ النية، وارفع أجرك.">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.v8.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <header>
    <img src="logo.png" alt="كنز النيات" class="logo-img">
    <div class="header-actions">
      <div class="user-area" onclick="App.showUserOverlay()">
        <button type="button" id="btn-user" class="icon-btn" title="تسجيل الدخول">👤</button>
        <span id="user-greeting" class="user-greeting"></span>
      </div>
      <button type="button" id="btn-install" class="icon-btn" onclick="App.doInstallPWA()" title="تثبيت التطبيق" style="display:none">📲</button>
      <button type="button" id="btn-font-size" class="icon-btn icon-btn-font" onclick="App.cycleFontSize()" title="حجم الخط">Aa</button>
      <button type="button" id="btn-theme" class="icon-btn" onclick="App.toggleTheme()" title="تبديل الوضع">🌙</button>
      <button type="button" class="icon-btn" onclick="App.shareApp()" title="مشاركة التطبيق">📤</button>
    </div>
  </header>

  <main id="main-content"></main>

  <div id="overlay" class="overlay"></div>

  <nav class="bottom-nav">
    <button type="button" class="nav-item active" id="nav-home" onclick="App.navigate('home')">
      <span class="icon">🕌</span>
      <span>اليوم</span>
    </button>
    <button type="button" class="nav-item" id="nav-library" onclick="App.navigate('library')">
      <span class="icon">📚</span>
      <span>المكتبة</span>
    </button>
    <button type="button" class="nav-item" id="nav-stats" onclick="App.navigate('stats')">
      <span class="icon">📊</span>
      <span>كنزك</span>
    </button>
  </nav>

  <script src="app.v17.js"></script>
</body>
</html>
